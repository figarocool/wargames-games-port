name: Build and Release WarGames

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsdl2-dev libsdl2-ttf-dev libsdl2-mixer-dev libx11-dev fonts-pc ffmpeg

      - name: Build Linux executable
        run: |
          make -C rebuild
          cp rebuild/wargame-c ./wargame-linux-x86_64
          chmod +x ./wargame-linux-x86_64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: wargame-linux-x86_64
          path: ./wargame-linux-x86_64

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_mixer
            mingw-w64-x86_64-SDL2_ttf

      - name: Build Windows executable
        shell: msys2 {0}
        run: |
          x86_64-w64-mingw32-gcc -O2 -std=c11 \
            $(pkg-config --cflags sdl2 SDL2_ttf SDL2_mixer) \
            -o wargame.exe \
            rebuild/src/main.c rebuild/src/media.c \
            rebuild/src/extended/bank_hack.c rebuild/src/extended/panam_extended.c rebuild/src/extended/games_extended.c \
            -lmingw32 -lSDL2main $(pkg-config --libs sdl2 SDL2_ttf SDL2_mixer) -lm

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: wargame-windows-x64
          path: wargame.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Homebrew dependencies
        run: |
          brew install sdl2 sdl2_ttf sdl2_mixer pkg-config

      - name: Build macOS executable
        run: |
          clang -O2 -std=c11 \
            $(pkg-config --cflags sdl2 SDL2_ttf SDL2_mixer) \
            -o wargame-macos \
            rebuild/src/main.c rebuild/src/media.c \
            rebuild/src/extended/bank_hack.c rebuild/src/extended/panam_extended.c rebuild/src/extended/games_extended.c \
            $(pkg-config --libs sdl2 SDL2_ttf SDL2_mixer) -lm
          chmod +x ./wargame-macos

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: wargame-macos
          path: ./wargame-macos

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: always() && !cancelled() && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package Windows Release (ZIP)
        run: |
          if [ -f artifacts/wargame-windows-x64/wargame.exe ]; then
            mkdir -p package-windows
            cp -r Gfx Gfx_it Snd Vid Wopr Wopr_it Readme.txt README.md LICENSE package-windows/
            cp SDL2.dll SDL2_mixer.dll SDL2_ttf.dll iconv.dll libbz2-1.dll libfreetype-6.dll libgcc_s_seh-1.dll libglib-2.0-0.dll libharfbuzz-0.dll libintl-8.dll libpcre2-8-0.dll libpng16-16.dll libwinpthread-1.dll zlib1.dll package-windows/
            cp artifacts/wargame-windows-x64/wargame.exe package-windows/
            cd package-windows && zip -r ../WarGames-Windows-x64.zip . && cd ..
          fi

      - name: Package Linux Release (TAR.GZ)
        run: |
          if [ -f artifacts/wargame-linux-x86_64/wargame-linux-x86_64 ]; then
            mkdir -p package-linux
            cp -r Gfx Gfx_it Snd Vid Wopr Wopr_it Readme.txt README.md LICENSE package-linux/
            cp artifacts/wargame-linux-x86_64/wargame-linux-x86_64 package-linux/wargame-linux
            chmod +x package-linux/wargame-linux
            tar -czf WarGames-Linux-x86_64.tar.gz -C package-linux .
          fi

      - name: Package macOS Release (ZIP)
        run: |
          if [ -f artifacts/wargame-macos/wargame-macos ]; then
            mkdir -p package-macos
            cp -r Gfx Gfx_it Snd Vid Wopr Wopr_it Readme.txt README.md LICENSE package-macos/
            cp artifacts/wargame-macos/wargame-macos package-macos/wargame-macos
            chmod +x package-macos/wargame-macos
            cd package-macos && zip -r ../WarGames-macOS.zip . && cd ..
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'WarGames Native C - v1.0.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            WarGames-Windows-x64.zip
            WarGames-Linux-x86_64.tar.gz
            WarGames-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
